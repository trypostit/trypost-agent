name: Sync plugin skill on release

# Regenerates skills/trypost/SKILL.md from the root SKILL.md whenever a GitHub
# release is published, and commits it to main so the Claude Code / Cursor / Grok
# plugin manifests always point at an up-to-date, real (non-symlink) file.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Copy SKILL.md into the plugin skill directory
        run: |
          mkdir -p skills/trypost
          cp SKILL.md skills/trypost/SKILL.md

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- skills/trypost/SKILL.md; then
            echo "skills/trypost/SKILL.md already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/trypost/SKILL.md
          git commit -m "chore: sync plugin skill for ${{ github.event.release.tag_name || 'manual run' }}"
          git push origin main
